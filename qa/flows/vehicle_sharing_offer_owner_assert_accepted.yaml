appId: app.incoherences.bojairu.dev
---
# Louys (owner): after Monica accepts, active share on hub + no outbound pending.
# Coordinator waits logcat applied=true before this flow; stopApp so navigation
# starts from home (Louys may still be deep on Partages from owner-send).
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "qa-home-vehicle-sharing"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: _accept_notification_prompt.yaml
- tapOn:
    id: "qa-home-vehicle-sharing"
- extendedWaitUntil:
    visible:
      id: "qa-vehicle-sharing-hub"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "qa-vehicle-sharing-shareable-active-qa-civic"
    timeout: 90000
- tapOn:
    id: "qa-vehicle-sharing-shareable-active-qa-civic"
- extendedWaitUntil:
    visible:
      id: "qa-vehicle-sharing-add-share"
    timeout: 45000
- assertNotVisible:
    id: "qa-vehicle-sharing-outbound-pending-invite"
- takeScreenshot: owner_offer_accepted
