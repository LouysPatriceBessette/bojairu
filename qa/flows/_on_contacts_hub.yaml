appId: app.incoherences.bojairu.dev
---
# App already running — open Contacts list without cold start.
- runFlow:
    when:
      visible:
        id: "qa-home-contacts"
    commands:
      - tapOn:
          id: "qa-home-contacts"
- extendedWaitUntil:
    visible:
      id: "qa-contacts-invite-fab"
    timeout: 30000
